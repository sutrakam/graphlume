ShortDescription: Deterministic code intelligence and change safety for AI coding agents.
Description: |-
  GraphLume indexes a repository into a local SQLite code graph of symbols,
  references, APIs, database access, tests, configuration and Git history, and
  serves it to AI coding agents over MCP, a CLI and REST. Every relationship
  carries a confidence level and the source location that justifies it. It
  ships as a single binary with no runtime dependencies and keeps its index on
  the local disk.
