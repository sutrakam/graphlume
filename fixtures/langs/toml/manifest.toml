# The sections every Cargo.toml and pyproject.toml carries are not definitions.
[package]
name = "demo"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[features]
default = ["fast"]

[dependencies]
serde = "1"

[dependencies.clap]
version = "4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
members = ["a", "b"]

[workspace.dependencies]
anyhow = "1"

[build-system]
requires = ["setuptools"]

[project]
name = "demo"

[project.urls]
Homepage = "https://example.com"

[project.optional-dependencies]
test = ["pytest"]

# Tool settings and profiles are named sections and are definitions.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[profile.release]
opt-level = 3

[[bin]]
name = "demo"
path = "src/main.rs"

[[bin]]
name = "demo-admin"
path = "src/admin.rs"
