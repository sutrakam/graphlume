<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">GraphLume Architecture</title>
  <desc id="archDesc">How GraphLume indexes your codebase, resolves compiler-backed edges, and serves them locally to AI coding agents via MCP.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Box Fill Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Flow Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="340" rx="14" fill="url(#archBg)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ================= SECTION 1: YOUR CODEBASE (LEFT) ================= -->
  <g transform="translate(48, 38)">
    <rect width="320" height="264" rx="12" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#f1f5f9"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1e40af" letter-spacing="0.5">1. YOUR CODEBASE (LOCAL)</text>

    <!-- Items -->
    <g transform="translate(20, 56)">
      <rect width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">Go · Python · TS · Java · Rust · C#</text>

      <rect y="50" width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="74" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">SQL Migrations, ORMs &amp; Schemas</text>

      <rect y="100" width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="124" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">HTTP API Endpoints &amp; Routes</text>

      <rect y="150" width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="174" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#334155">Git Commits, Diff &amp; Test Suites</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 370 170 L 450 170" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="382" y="154" width="58" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="388" y="167" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0284c7">index</text>

  <!-- ================= SECTION 2: GRAPHLUME ENGINE (CENTER) ================= -->
  <g transform="translate(460, 24)">
    <rect width="360" height="292" rx="12" fill="url(#engineGrad)" stroke="#3b82f6" stroke-width="1.4" filter="url(#boxShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="360" height="40" rx="12" fill="#bfdbfe" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#059669"/>
    <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a" letter-spacing="0.5">2. GRAPHLUME ENGINE (OFFLINE)</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 52)">
      <!-- Box A: Parser & SCIP -->
      <rect width="320" height="52" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0284c7">AST &amp; Compiler Indexers</text>
      <text x="14" y="39" font-family="ui-monospace, monospace" font-size="11" fill="#475569">Tree-sitter (206 langs) + SCIP + go/types</text>

      <!-- Box B: Graph Database -->
      <rect y="62" width="320" height="52" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">Local Graph Store (.graphlume/index.db)</text>
      <text x="14" y="101" font-family="ui-monospace, monospace" font-size="11" fill="#475569">Embedded SQLite + FTS5 full-text engine</text>

      <!-- Box C: Confidence & Blast Radius -->
      <rect y="124" width="320" height="52" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#d97706">Confidence &amp; Blast Radius Engine</text>
      <text x="14" y="163" font-family="ui-monospace, monospace" font-size="11" fill="#475569">Proven exact vs high vs medium tiers</text>

      <!-- Box D: Incremental sync -->
      <rect y="186" width="320" height="34" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="208" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">⚡ Fast sub-second incremental refresh</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 822 170 L 902 170" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowEmerald)"/>
  <rect x="836" y="154" width="54" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="842" y="167" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#059669">MCP</text>

  <!-- ================= SECTION 3: YOUR AI AGENTS (RIGHT) ================= -->
  <g transform="translate(912, 38)">
    <rect width="320" height="264" rx="12" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#f1f5f9"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#065f46" letter-spacing="0.5">3. AI CODING AGENTS (MCP)</text>

    <!-- Content -->
    <g transform="translate(20, 56)">
      <rect width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Claude Code · Cursor · Codex</text>

      <rect y="50" width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">VS Code (Copilot) · Windsurf · Zed</text>

      <rect y="100" width="280" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Cline · Roo Code · Continue · Goose</text>

      <!-- Outcome badge -->
      <rect y="150" width="280" height="40" rx="6" fill="#d1fae5" stroke="#10b981"/>
      <text x="14" y="174" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#065f46">✓ Answers with file:line evidence</text>
    </g>
  </g>
</svg>
